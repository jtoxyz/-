name: Student account build and size check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-size:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Next.js build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://nbhpsjhqaakaweeywhxa.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-for-build-only
        run: npm run build

      - name: Configure Cloudflare adapter in CI
        env:
          CI: 'true'
        run: npx --yes wrangler@4.110.0 setup --yes

      - name: Build OpenNext Worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://nbhpsjhqaakaweeywhxa.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-for-build-only
        run: npx opennextjs-cloudflare build

      - name: Cloudflare dry-run bundle
        run: |
          set -o pipefail
          npx wrangler deploy --dry-run --outdir bundled 2>&1 | tee wrangler-size.txt

      - name: Enforce compressed Worker under 3 MiB
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path('wrangler-size.txt').read_text(encoding='utf-8', errors='replace')
          matches = re.findall(r'gzip:\s*([0-9.]+)\s*(KiB|MiB|MB|KB|B)', text, flags=re.I)
          if not matches:
              raise SystemExit('Could not find Wrangler gzip size in output.')

          value, unit = matches[-1]
          value = float(value)
          factors = {'b': 1, 'kb': 1000, 'mb': 1000**2, 'kib': 1024, 'mib': 1024**2}
          size = value * factors[unit.lower()]
          limit = 3 * 1024 * 1024
          print(f'Compressed Worker: {size / 1024 / 1024:.3f} MiB')
          if size >= limit:
              raise SystemExit(f'Compressed Worker is {size / 1024 / 1024:.3f} MiB; it must stay below 3 MiB.')
          PY
