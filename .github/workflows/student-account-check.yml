name: Cloudflare Pages build and size check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-size:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the same Pages adapter versions as production
        run: npm install --no-save --legacy-peer-deps @cloudflare/next-on-pages@1.13.16 wrangler@3.114.17

      - name: Build with the same Pages adapter as production
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://nbhpsjhqaakaweeywhxa.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-for-build-only
        run: npx next-on-pages

      - name: Bundle generated Pages Worker
        run: |
          set -o pipefail
          npx wrangler deploy .vercel/output/static/_worker.js/index.js \
            --dry-run \
            --outdir bundled-pages \
            --compatibility-date 2026-07-29 2>&1 | tee wrangler-pages-size.txt

      - name: Enforce compressed Pages Worker under 3 MiB
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path('wrangler-pages-size.txt').read_text(encoding='utf-8', errors='replace')
          matches = re.findall(r'gzip:\s*([0-9.]+)\s*(KiB|MiB|MB|KB|B)', text, flags=re.I)
          if not matches:
              raise SystemExit('Could not find the generated Pages Worker gzip size.')

          value, unit = matches[-1]
          value = float(value)
          factors = {'b': 1, 'kb': 1000, 'mb': 1000**2, 'kib': 1024, 'mib': 1024**2}
          size = value * factors[unit.lower()]
          limit = 3 * 1024 * 1024
          print(f'Compressed Pages Worker: {size / 1024 / 1024:.3f} MiB')
          if size >= limit:
              raise SystemExit(f'Compressed Pages Worker is {size / 1024 / 1024:.3f} MiB; it must stay below 3 MiB.')
          PY
