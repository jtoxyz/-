# Supabaseの無料プランは7日間APIアクティビティが無いとプロジェクトが自動的に
# 一時停止されるため、定期的に軽いAPIリクエストを送って一時停止を防ぐ。
#
# GitHub Actions(このリポジトリ外)から叩く方式を採用している。
# pg_cron/Edge Functionsの定期実行はSupabaseプロジェクト自体の中で動くため、
# 一時停止してしまった後は起動できず、そもそも一時停止を防ぐ目的には使えない。
name: Supabase keepalive

on:
  schedule:
    # 週3回(月・水・金) 03:15 UTC = 12:15 JST
    # 最大間隔は金曜→月曜の3日で、7日間の一時停止しきい値に対して
    # 十分な安全マージンを確保している(1回のスキップ・失敗があっても安全)。
    - cron: '15 3 * * 1,3,5'
  # 手動実行・動作確認用
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set."
            exit 1
          fi

          http_status=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            --max-time 20 \
            "${SUPABASE_URL}/rest/v1/events?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP status: ${http_status}"
          cat /tmp/response.json
          echo

          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo "::error::Supabase keepalive request failed with HTTP ${http_status}"
            exit 1
          fi

          echo "Supabase keepalive ping succeeded."
