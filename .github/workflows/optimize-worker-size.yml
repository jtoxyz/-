name: Optimize Cloudflare worker size

on:
  push:
    paths:
      - '.github/workflows/optimize-worker-size.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unnecessary Edge Runtime declarations
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('src/app/admin/daily-payment-qr/page.tsx'),
              Path('src/app/admin/payment-qr/page.tsx'),
              Path('src/app/admin/payment-management/page.tsx'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              text = text.replace("\nexport const runtime = 'edge';\n", "\n")
              path.write_text(text, encoding='utf-8')
          PY
      - name: Build check
        run: npm ci && npm run build
      - name: Commit optimized pages
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/admin/daily-payment-qr/page.tsx src/app/admin/payment-qr/page.tsx src/app/admin/payment-management/page.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Reduce Cloudflare worker bundle size"
          git push
